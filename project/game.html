<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="./css/gameStyle.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="./scripts/gameScript.js" defer></script>
    <script src="./scripts/story.js"></script>
    <link rel="icon" href="./favicon/android-chrome-512x512.png">
</head>

<body>
    <div id="intro-container">
        <div id="frame">
            <div id="image" class="image"></div>

            <div id="bottom-ui">
                <div id="text" class="text"></div>
                <div id="choices" style="display:none;"></div>
                <div id="next-btn" onclick="next()">
                    <img src="./images/Button_Weiter.png" alt="WEITER">
                </div>
            </div>
        </div>
    </div>
    <div id="pause-menu">
        <h1>PAUSE</h1>
    </div>
    <div id="game-container">
        <img id="game-character" style="display:none;" alt="Character">
        <div id="dialog">
            <p id="dialog-text"></p>
        </div>
        <div id="game-choices"></div>
    </div>
</body>

</html>
