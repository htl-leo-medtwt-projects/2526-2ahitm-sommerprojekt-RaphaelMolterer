<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="./css/gameStyle.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="./scripts/gameScript.js" defer></script>
    <script src="./scripts/story.js"></script>
    <link rel="icon" href="./favicon/android-chrome-512x512.png">
</head>
<body>
    <div id="flash-effect-overlay"></div>
    <button id="reset-game-btn" onclick="resetGame()">🗑️</button>
    <div id="audio-controls">
        <button id="mute-music-btn" onclick="toggleMuteMusic()">Musik: AN</button>
        <button id="mute-sounds-btn" onclick="toggleMuteSounds()">Sounds: AN</button>
    </div>
    <div id="intro-container">
        <div id="frame">
            <div id="image" class="image"></div>

            <div id="bottom-ui">
                <div id="text" class="text"></div>
                <div id="choices" style="display:none;"></div>
                <div id="next-btn" onclick="next()">
                    <img src="./game_images/Button_Stone.png" alt="WEITER">
                </div>
            </div>
        </div>
    </div>
    <div id="pause-menu">
        <div id="inventory-grid"></div>
        <button class="close-backpack" onclick="toggleInventory()">X</button>
    </div>
    <div id="item-warning" class="warning-overlay">
        <div class="warning-content">
            <p id="warning-text">Du hast das benoetigte Item nicht!</p>
            <button onclick="closeWarning()">Verstanden</button>
        </div>
    </div>
    <div id="reset-confirm-overlay" class="warning-overlay">
        <div class="warning-content">
            <p>Moechtest du das Spiel wirklich zuruecksetzen?</p>
            <p id="reset-confirm-text">Dein gesamter Fortschritt, alle Items und dein Karma gehen verloren.</p>
            <div id="ask-reset">
                <button onclick="executeResetGame()" style="background: #d12310;">Ja, zuruecksetzen</button>
                <button onclick="closeResetConfirm()" style="background: #34495e;">Abbrechen</button>
            </div>
        </div>
    </div>
    <div id="game-container">
        <img id="game-character" style="display:none;" alt="Character">
        <div id="dialog">
            <p id="dialog-text"></p>
        </div>
        <div id="game-choices"></div>
    </div>
</body>

</html>
